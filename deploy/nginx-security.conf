# HotelEase -- nginx security hardening (reference)
#
# These directives address the server-config findings from the security review:
#   - M2  missing security headers
#   - L1  server version disclosure
#   - H1  HTTPS (the commented TLS block + redirect)
#
# They are NOT applied automatically. On the EC2 host, fold them into the
# existing server block at /etc/nginx/sites-available/hotelease, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------

# In the http{} or server{} scope: stop advertising the nginx version.
server_tokens off;

# --- Security response headers (add inside the server{} block) -------------
# add_header applies to responses nginx generates AND proxied ones as long as
# no deeper add_header overrides them. "always" sends them on error pages too.

add_header X-Content-Type-Options    "nosniff"                       always;
add_header X-Frame-Options           "DENY"                          always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection          "0"                             always;

# Content-Security-Policy: this app uses only same-origin HTML/CSS/JS and inline
# SVG, no external scripts or CDNs, so a strict policy fits. If you later add a
# CDN or inline <style>/<script>, widen the matching directive rather than
# dropping the header. Test in a browser (console) after enabling.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# --- Per-endpoint rate limits (defence in depth alongside Flask) ------------
# The app now runs behind ProxyFix, so Flask-Limiter already sees the real
# client IP via X-Forwarded-For. These nginx limits add a second layer that
# rejects floods before they ever reach Gunicorn. Declare the zones once in the
# http{} scope (e.g. in nginx.conf):
#     limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
#     limit_req_zone $binary_remote_addr zone=booking:10m rate=10r/m;
# then inside the matching location blocks (before proxy_pass):
#     location = /api/auth/login {
#         limit_req zone=login burst=5 nodelay;   limit_req_status 429;
#         proxy_pass http://127.0.0.1:8000;  # keep existing proxy_* headers
#     }
#     location = /api/bookings {
#         limit_req zone=booking burst=5 nodelay; limit_req_status 429;
#         proxy_pass http://127.0.0.1:8000;
#     }
# Ensure the block that proxies /api also forwards the client IP:
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#
# robots.txt is now a static file at the frontend root (served automatically by
# the existing static-file location), so no nginx change is needed for it.

# ===========================================================================
# HTTPS (H1) -- requires a DNS name; Let's Encrypt will not issue for a bare IP.
# Once a domain points at 52.16.99.41:
#     sudo apt install certbot python3-certbot-nginx
#     sudo certbot --nginx -d your-domain.example
# certbot rewrites this server block for TLS on 443 and adds an 80->443 redirect.
# After TLS is live, also:
#     - set SESSION_COOKIE_SECURE=1 in backend/.env and restart hotelease
#     - enable HSTS below
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# ===========================================================================
