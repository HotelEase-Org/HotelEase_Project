# HotelEase -- nginx security hardening (reference)

server_tokens off;



add_header X-Content-Type-Options    "nosniff"                       always;
add_header X-Frame-Options           "DENY"                          always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection          "0"                             always;


add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;


